# One-shot export of Brief production data via a temporary locked Pages Function.
# Uses SESSIONS KV binding (API token may lack Workers KV permissions).
name: Export production data

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: brief-data-export
  cancel-in-progress: false

jobs:
  export:
    name: Export KV + runtime env
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT_NAME: serenity-brief-agency
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install tools
        run: |
          npm install -g wrangler@4
          npm install --ignore-scripts

      - name: Prepare export workspace
        id: prep
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/export"

      - name: Read Pages project env metadata
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT_NAME}" \
            > "$RUNNER_TEMP/export/pages-project.json" || true
          python3 <<'PY'
          import json, os
          path = os.environ["RUNNER_TEMP"] + "/export/pages-project.json"
          try:
              p = json.load(open(path, encoding="utf-8"))
          except Exception as e:
              print("skip pages meta:", e)
              raise SystemExit(0)
          if not p.get("success"):
              print("pages meta not available:", p)
              raise SystemExit(0)
          cfg = (p.get("result") or {}).get("deployment_configs") or {}

          def summarize(env_cfg):
              vars_ = (env_cfg or {}).get("env_vars") or {}
              out = {}
              for k, v in vars_.items():
                  if isinstance(v, dict):
                      out[k] = {
                          "type": v.get("type"),
                          "has_value": "value" in v and v.get("value") not in (None, ""),
                      }
                  else:
                      out[k] = {"type": "raw", "has_value": bool(v)}
              return out

          def values(env_cfg):
              vars_ = (env_cfg or {}).get("env_vars") or {}
              out = {}
              for k, v in vars_.items():
                  if isinstance(v, dict) and v.get("type") != "secret_text" and "value" in v:
                      out[k] = v.get("value")
              return out

          meta = {
              "production": summarize(cfg.get("production")),
              "preview": summarize(cfg.get("preview")),
          }
          plain = {
              "production": values(cfg.get("production")),
              "preview": values(cfg.get("preview")),
          }
          open(os.environ["RUNNER_TEMP"] + "/export/pages-env-meta.json", "w", encoding="utf-8").write(
              json.dumps(meta, indent=2, ensure_ascii=False)
          )
          open(os.environ["RUNNER_TEMP"] + "/export/pages-env-plain.json", "w", encoding="utf-8").write(
              json.dumps(plain, indent=2, ensure_ascii=False)
          )
          print(json.dumps(meta, indent=2, ensure_ascii=False))
          PY

      - name: Install temporary runtime export endpoint
        run: |
          set -euo pipefail
          TOKEN='${{ steps.prep.outputs.token }}'
          mkdir -p functions/api
          cat > functions/api/__migrate_export.js <<'EOF'
          export async function onRequestGet({ request, env }) {
            const expected = env.MIGRATION_EXPORT_TOKEN;
            const got = request.headers.get("x-migration-token") || "";
            if (!expected || got !== expected) {
              return new Response(JSON.stringify({ ok: false, message: "Not found" }), {
                status: 404,
                headers: { "content-type": "application/json; charset=utf-8" }
              });
            }

            const pick = (key) => (env[key] == null ? null : String(env[key]));
            const kvEntries = [];
            if (env.SESSIONS?.list && env.SESSIONS?.get) {
              let cursor;
              do {
                const listed = await env.SESSIONS.list({ limit: 1000, cursor });
                cursor = listed.cursor;
                for (const key of listed.keys || []) {
                  const value = await env.SESSIONS.get(key.name);
                  kvEntries.push({
                    key: key.name,
                    value,
                    expiration: key.expiration ?? null,
                    metadata: key.metadata ?? null
                  });
                }
              } while (cursor);
            }

            const body = {
              ok: true,
              exportedAt: new Date().toISOString(),
              env: {
                APPS_SCRIPT_URL: pick("APPS_SCRIPT_URL"),
                FORM_API_SECRET: pick("FORM_API_SECRET"),
                ADMIN_USERS_JSON: pick("ADMIN_USERS_JSON"),
                ADMIN_SECRET: pick("ADMIN_SECRET"),
                AMO_DOMAIN: pick("AMO_DOMAIN"),
                AMO_ACCESS_TOKEN: pick("AMO_ACCESS_TOKEN"),
                PRESALE_PORTAL_URL: pick("PRESALE_PORTAL_URL"),
                PRESALE_PORTAL_IMPORT_TOKEN: pick("PRESALE_PORTAL_IMPORT_TOKEN"),
                SENQ_SSO_SECRET: pick("SENQ_SSO_SECRET"),
                SENQ_BASE_URL: pick("SENQ_BASE_URL"),
                SENQ_APP_ID: pick("SENQ_APP_ID"),
                BRIEF_INTEGRATION_TOKEN: pick("BRIEF_INTEGRATION_TOKEN")
              },
              kv: kvEntries
            };
            return new Response(JSON.stringify(body), {
              status: 200,
              headers: { "content-type": "application/json; charset=utf-8", "cache-control": "no-store" }
            });
          }
          EOF
          printf '%s' "$TOKEN" | wrangler pages secret put MIGRATION_EXPORT_TOKEN --project-name "$PAGES_PROJECT_NAME"

      - name: Build Pages bundle
        run: |
          set -euo pipefail
          node build-pages.mjs
          test -f functions/api/__migrate_export.js
          ls dist | head

      - name: Deploy temporary export build to production
        run: wrangler pages deploy dist --project-name "$PAGES_PROJECT_NAME" --branch main --commit-dirty=true

      - name: Fetch runtime export from production
        run: |
          set -euo pipefail
          TOKEN='${{ steps.prep.outputs.token }}'
          for i in $(seq 1 15); do
            CODE=$(curl -sS -o "$RUNNER_TEMP/export/runtime-export.json" -w "%{http_code}" \
              -H "x-migration-token: ${TOKEN}" \
              "https://brief.serenity.agency/api/__migrate_export" || true)
            echo "attempt $i -> HTTP $CODE"
            if [[ "$CODE" == "200" ]] && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("ok")' "$RUNNER_TEMP/export/runtime-export.json" 2>/dev/null; then
              python3 <<'PY'
          import collections, json, os
          path = os.environ["RUNNER_TEMP"] + "/export/runtime-export.json"
          data = json.load(open(path, encoding="utf-8"))
          env = data.get("env") or {}
          kv = data.get("kv") or []
          print("env present:", {k: bool(v) for k, v in env.items()})
          prefixes = collections.Counter()
          statuses = collections.Counter()
          users = collections.Counter()
          with open(os.environ["RUNNER_TEMP"] + "/export/kv-sessions.jsonl", "w", encoding="utf-8") as out:
              for row in kv:
                  out.write(json.dumps(row, ensure_ascii=False) + "\n")
                  key = row.get("key") or ""
                  prefixes[key.split(":", 1)[0] if key else "?"] += 1
                  if key.startswith("session:"):
                      try:
                          val = json.loads(row.get("value") or "{}")
                      except Exception:
                          val = {}
                      statuses[val.get("status") or "?"] += 1
                      users[val.get("createdByEmail") or "?"] += 1
          summary = {
              "keys": len(kv),
              "prefixes": dict(prefixes),
              "session_statuses": dict(statuses),
              "created_by": dict(users),
              "exportedAt": data.get("exportedAt"),
          }
          open(os.environ["RUNNER_TEMP"] + "/export/kv-summary.json", "w", encoding="utf-8").write(
              json.dumps(summary, ensure_ascii=False, indent=2)
          )
          # Keep env in a separate file for import; mask nothing in artifact (private retention 3d)
          open(os.environ["RUNNER_TEMP"] + "/export/runtime-env.json", "w", encoding="utf-8").write(
              json.dumps({"ok": True, "exportedAt": data.get("exportedAt"), "env": env}, ensure_ascii=False, indent=2)
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
              exit 0
            fi
            sleep 5
          done
          echo "Failed to fetch runtime export"
          head -c 500 "$RUNNER_TEMP/export/runtime-export.json" || true
          exit 1

      - name: Remove export endpoint and redeploy clean
        if: always()
        run: |
          set -euo pipefail
          rm -f functions/api/__migrate_export.js
          node build-pages.mjs
          wrangler pages deploy dist --project-name "$PAGES_PROJECT_NAME" --branch main --commit-dirty=true
          wrangler pages secret delete MIGRATION_EXPORT_TOKEN --project-name "$PAGES_PROJECT_NAME" --force || true

      - name: Upload export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-production-export
          path: ${{ runner.temp }}/export/
          retention-days: 3
          if-no-files-found: error
