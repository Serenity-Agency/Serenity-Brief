# One-shot export of Brief production data (KV sessions + Pages runtime env).
# Trigger: workflow_dispatch. Temporarily deploys a locked export endpoint, then removes it.
name: Export production data

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: brief-data-export
  cancel-in-progress: false

jobs:
  export:
    name: Export KV + runtime env
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT_NAME: serenity-brief-agency
      KV_NAMESPACE_ID: 8987bc15a011482c8ac1263d4b19442e
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install tools
        run: |
          npm install -g wrangler@4
          npm install --ignore-scripts

      - name: Prepare export workspace
        id: prep
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/export"

      - name: Export KV namespace
        run: |
          set -euo pipefail
          python3 <<'PY'
          import collections, json, os, urllib.parse, urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          ns = os.environ["KV_NAMESPACE_ID"]
          out_dir = os.environ["RUNNER_TEMP"] + "/export"
          out_path = out_dir + "/kv-sessions.jsonl"

          def api(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.load(resp)

          def get_value(key):
              enc = urllib.parse.quote(key, safe="")
              url = f"https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}/values/{enc}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.read().decode("utf-8", errors="replace")

          cursor = None
          total = 0
          prefixes = collections.Counter()
          statuses = collections.Counter()
          users = collections.Counter()

          with open(out_path, "w", encoding="utf-8") as out:
              while True:
                  url = f"https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}/keys?limit=1000"
                  if cursor:
                      url += f"&cursor={urllib.parse.quote(cursor)}"
                  data = api(url)
                  if not data.get("success"):
                      raise SystemExit(f"KV list failed: {data}")
                  keys = data.get("result") or []
                  for row in keys:
                      key = row["name"]
                      value = get_value(key)
                      out.write(json.dumps({"key": key, "value": value, "meta": row}, ensure_ascii=False) + "\n")
                      total += 1
                      prefixes[key.split(":", 1)[0]] += 1
                      if key.startswith("session:"):
                          try:
                              val = json.loads(value)
                          except Exception:
                              val = {}
                          statuses[val.get("status") or "?"] += 1
                          users[val.get("createdByEmail") or "?"] += 1
                  cursor = (data.get("result_info") or {}).get("cursor") or None
                  print(f"batch={len(keys)} total={total} cursor={'yes' if cursor else 'end'}")
                  if not cursor:
                      break

          summary = {
              "keys": total,
              "prefixes": dict(prefixes),
              "session_statuses": dict(statuses),
              "created_by": dict(users),
          }
          with open(out_dir + "/kv-summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Read Pages project env metadata
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT_NAME}" \
            > "$RUNNER_TEMP/export/pages-project.json"
          python3 <<'PY'
          import json, os
          p = json.load(open(os.environ["RUNNER_TEMP"] + "/export/pages-project.json", encoding="utf-8"))
          if not p.get("success"):
              raise SystemExit(p)
          cfg = (p.get("result") or {}).get("deployment_configs") or {}

          def summarize(env_cfg):
              vars_ = (env_cfg or {}).get("env_vars") or {}
              out = {}
              for k, v in vars_.items():
                  if isinstance(v, dict):
                      out[k] = {
                          "type": v.get("type"),
                          "has_value": "value" in v and v.get("value") not in (None, ""),
                      }
                  else:
                      out[k] = {"type": "raw", "has_value": bool(v)}
              return out

          def values(env_cfg):
              vars_ = (env_cfg or {}).get("env_vars") or {}
              out = {}
              for k, v in vars_.items():
                  if isinstance(v, dict) and v.get("type") != "secret_text" and "value" in v:
                      out[k] = v.get("value")
              return out

          meta = {
              "production": summarize(cfg.get("production")),
              "preview": summarize(cfg.get("preview")),
          }
          plain = {
              "production": values(cfg.get("production")),
              "preview": values(cfg.get("preview")),
          }
          open(os.environ["RUNNER_TEMP"] + "/export/pages-env-meta.json", "w", encoding="utf-8").write(
              json.dumps(meta, indent=2, ensure_ascii=False)
          )
          open(os.environ["RUNNER_TEMP"] + "/export/pages-env-plain.json", "w", encoding="utf-8").write(
              json.dumps(plain, indent=2, ensure_ascii=False)
          )
          print(json.dumps(meta, indent=2, ensure_ascii=False))
          PY

      - name: Install temporary runtime export endpoint
        run: |
          set -euo pipefail
          TOKEN='${{ steps.prep.outputs.token }}'
          mkdir -p functions/api
          cat > functions/api/__migrate_export.js <<'EOF'
          export async function onRequestGet({ request, env }) {
            const expected = env.MIGRATION_EXPORT_TOKEN;
            const got = request.headers.get("x-migration-token") || "";
            if (!expected || got !== expected) {
              return new Response(JSON.stringify({ ok: false, message: "Not found" }), {
                status: 404,
                headers: { "content-type": "application/json; charset=utf-8" }
              });
            }
            const pick = (key) => (env[key] == null ? null : String(env[key]));
            const body = {
              ok: true,
              exportedAt: new Date().toISOString(),
              env: {
                APPS_SCRIPT_URL: pick("APPS_SCRIPT_URL"),
                FORM_API_SECRET: pick("FORM_API_SECRET"),
                ADMIN_USERS_JSON: pick("ADMIN_USERS_JSON"),
                ADMIN_SECRET: pick("ADMIN_SECRET"),
                AMO_DOMAIN: pick("AMO_DOMAIN"),
                AMO_ACCESS_TOKEN: pick("AMO_ACCESS_TOKEN"),
                PRESALE_PORTAL_URL: pick("PRESALE_PORTAL_URL"),
                PRESALE_PORTAL_IMPORT_TOKEN: pick("PRESALE_PORTAL_IMPORT_TOKEN"),
                SENQ_SSO_SECRET: pick("SENQ_SSO_SECRET"),
                SENQ_BASE_URL: pick("SENQ_BASE_URL"),
                SENQ_APP_ID: pick("SENQ_APP_ID"),
                BRIEF_INTEGRATION_TOKEN: pick("BRIEF_INTEGRATION_TOKEN")
              }
            };
            return new Response(JSON.stringify(body), {
              status: 200,
              headers: { "content-type": "application/json; charset=utf-8", "cache-control": "no-store" }
            });
          }
          EOF
          printf '%s' "$TOKEN" | wrangler pages secret put MIGRATION_EXPORT_TOKEN --project-name "$PAGES_PROJECT_NAME"

      - name: Build Pages bundle
        run: |
          set -euo pipefail
          node build-pages.mjs
          test -f functions/api/__migrate_export.js
          ls dist | head

      - name: Deploy temporary export build to production
        run: wrangler pages deploy dist --project-name "$PAGES_PROJECT_NAME" --branch main --commit-dirty=true

      - name: Fetch runtime env from production
        run: |
          set -euo pipefail
          TOKEN='${{ steps.prep.outputs.token }}'
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o "$RUNNER_TEMP/export/runtime-env.json" -w "%{http_code}" \
              -H "x-migration-token: ${TOKEN}" \
              "https://brief.serenity.agency/api/__migrate_export" || true)
            echo "attempt $i -> HTTP $CODE"
            if [[ "$CODE" == "200" ]]; then
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("ok"); print("present:", {k: bool(v) for k,v in (d.get("env") or {}).items()})' "$RUNNER_TEMP/export/runtime-env.json"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to fetch runtime env"
          cat "$RUNNER_TEMP/export/runtime-env.json" || true
          exit 1

      - name: Remove export endpoint and redeploy clean
        if: always()
        run: |
          set -euo pipefail
          rm -f functions/api/__migrate_export.js
          node build-pages.mjs
          wrangler pages deploy dist --project-name "$PAGES_PROJECT_NAME" --branch main --commit-dirty=true
          wrangler pages secret delete MIGRATION_EXPORT_TOKEN --project-name "$PAGES_PROJECT_NAME" --force || true

      - name: Upload export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-production-export
          path: ${{ runner.temp }}/export/
          retention-days: 3
          if-no-files-found: error
