name: Cloudflare Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT_NAME: serenity-brief-agency
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and tests
        run: pnpm test

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: pnpm dlx wrangler@latest pages deploy dist --project-name "$PAGES_PROJECT_NAME" --branch "$GITHUB_HEAD_REF"

      - name: Deploy main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm dlx wrangler@latest pages deploy dist --project-name "$PAGES_PROJECT_NAME" --branch main
